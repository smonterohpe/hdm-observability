server {
    listen 8082;
    server_name _;

    root /var/www/hdm-observability;
    index index.html;

    # Proxy al backend HDM (VM2, puerto 8001 — coexiste con FBS en 8000)
    location /api/ {
        proxy_pass         http://10.0.0.2:8001;   # IP de VM2 — ajustar si cambia
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
}
