server {
    listen 8082;
    server_name _;

    root /var/www/hdm-observability;
    index index.html;

    # ── Backend HDM (VM2) ──────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass         http://10.10.44.14:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # ── zerto-probe HDM (corre en ESTA misma VM, puerto 5003) ─────────
    # FBS usa /zerto/ → 5002. HDM usa /zerto-hdm/ → 5003.
    location ^~ /zerto-hdm/ {
        proxy_pass         http://127.0.0.1:5003/zerto/;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
    }

    # ── SPA estática ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
}
