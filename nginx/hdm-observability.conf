server {
    listen 8082;
    server_name _;

    root /var/www/hdm-observability;
    index index.html;

    # ── Backend HDM (VM2 :8001) ────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass         http://10.10.44.14:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # ── zerto-probe HDM (localhost :5003) ──────────────────────────────
    location ^~ /zerto-hdm/ {
        proxy_pass         http://127.0.0.1:5003/zerto/;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
    }

    # ── Frontend VM (VM1 :8081) — ping HTTP ───────────────────────────
    location ^~ /check/frontend/ {
        proxy_pass         http://10.10.44.13:8081/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ── sys-probe Frontend VM (VM1 :5001) ─────────────────────────────
    location ^~ /check/frontend-sys/ {
        proxy_pass         http://10.10.44.13:5001/;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ── db-probe Database VM (VM3 :5000) ──────────────────────────────
    location ^~ /check/db/ {
        proxy_pass         http://10.10.44.15:5000/;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ── sys-probe Database VM (VM3 :5001) ─────────────────────────────
    location ^~ /check/db-sys/ {
        proxy_pass         http://10.10.44.15:5001/;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ── SPA estática ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
}
